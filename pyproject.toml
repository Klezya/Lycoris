[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lycoris"
version = "0.1.0"
description = "CLI para simplificar la gestión de seguridad en servidores Debian/Ubuntu"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "rich>=13",
]

[project.scripts]
lycoris = "lycoris.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["lycoris*"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["lycoris"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
